name: Release OTA Update

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия обновления (например: 1.1.2)'
        required: true
        default: '1.1.2'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Получение кода
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📝 Обновление версии и прямой ссылки в update_manifest.json
        run: |
          VERSION="${{ github.event.inputs.version }}"
          RAW_BUNDLE_URL="https://raw.githubusercontent.com/${{ github.repository }}/main/bundle.zip"
          cd www
          jq --arg v "$VERSION" --arg url "$RAW_BUNDLE_URL" '.version = $v | .bundleUrl = $url' update_manifest.json > tmp.json && mv tmp.json update_manifest.json

      - name: 🗜️ Архивация папки www в bundle.zip
        run: |
          rm -f bundle.zip
          cd www
          zip -r ../bundle.zip ./*

      - name: 💾 Коммит bundle.zip и update_manifest.json в main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add www/update_manifest.json bundle.zip
          git commit -m "chore(ota): release bundle v${{ github.event.inputs.version }} [skip ci]" || echo "No changes to commit"
          git push origin main

      - name: 🚀 Создание GitHub Release (для истории)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: OTA Update v${{ github.event.inputs.version }}
          files: bundle.zip
          draft: false
          prerelease: false
