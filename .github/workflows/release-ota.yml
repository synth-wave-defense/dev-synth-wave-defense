name: Release OTA Update

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия обновления (например: 1.0.1)'
        required: true
        default: '1.0.1'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Разрешение на создание релизов

    steps:
      - name: 📥 Получение кода
        uses: actions/checkout@v4

      - name: 🗜️ Архивация папки www
        run: |
          cd www
          zip -r ../bundle.zip ./*

      - name: 🚀 Создание релиза и загрузка архива
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: OTA Update v${{ github.event.inputs.version }}
          files: bundle.zip
          draft: false
          prerelease: false